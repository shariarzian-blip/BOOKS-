<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paramshanti TV</title>
<style>html,body{margin:0;background:#fffdf8}.wrap{padding:0 6vw}@media(min-width:768px){.wrap{padding:0 4vw}}</style>
</head>
<body>
<div class="wrap">
<!-- Paramshanti TV · paste this whole snippet into one Squarespace Code Block (HTML) · built 2026-11-23 -->
<style id="pstv-style">
/* Paramshanti TV — self-contained and scoped to .pstv / .pstv-layer, so it can live in a Squarespace Code Block. */
@font-face{font-family:'Psh20 DM Sans';font-style:normal;font-weight:400 600;font-display:swap;src:url(https://static1.squarespace.com/static/687e903fdaec501ece18160e/t/6ab61e0a50510f70ebcbad45/1790320138335/psh20-dm-sans.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

.pstv,.pstv-layer{
  --tv-paper:#fffdf8;--tv-card:#ffffff;--tv-wash:#fdf5df;--tv-ink:#2e2710;--tv-ink2:#5e4b1d;--tv-muted:#6d685f;
  --tv-line:#eedfb6;--tv-line2:rgba(199,154,42,.32);--tv-gold:#8a6d1f;--tv-gold2:#c79a2a;
  --tv-sun:linear-gradient(135deg,#ffe082,#f2bf3f);--tv-sun-ink:#3d2f08;--tv-led:#ffd54a;--tv-red:#d8362a;--tv-black:#0c0c0e;
  --tv-sans:'Psh20 DM Sans','DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans','Noto Sans Devanagari','Kohinoor Devanagari','Nirmala UI',Arial,sans-serif;
  --tv-mono:ui-monospace,'SF Mono',Menlo,Consolas,'Roboto Mono',monospace;
  --tv-ease:cubic-bezier(.22,.61,.36,1);
}
.pstv{box-sizing:border-box;position:relative;display:block;width:100%;margin:0;padding:20px 0 48px;background:var(--tv-paper);color:var(--tv-ink);
  font:400 15px/1.5 var(--tv-sans);text-align:left;letter-spacing:0;text-transform:none;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overflow-wrap:anywhere}
.pstv *,.pstv *::before,.pstv *::after,.pstv-layer *,.pstv-layer *::before,.pstv-layer *::after{box-sizing:border-box}
.pstv.pstv :where(input,button,iframe,img,svg,ol,li,h2,h3,p),.pstv-layer.pstv-layer :where(button,iframe,p){box-sizing:border-box}
.pstv.pstv :where(h1,h2,h3,h4,p,ol,ul,li,figure){margin:0;padding:0;color:inherit;font:inherit;letter-spacing:inherit;text-transform:none;list-style:none}
.pstv.pstv :where(button),.pstv-layer.pstv-layer :where(button){appearance:none;-webkit-appearance:none;font:inherit;color:inherit;background:none;border:0;border-radius:0;padding:0;margin:0;
  cursor:pointer;text-align:inherit;letter-spacing:inherit;text-transform:none;min-height:0;box-shadow:none;-webkit-tap-highlight-color:transparent}
.pstv.pstv :where(a),.pstv-layer.pstv-layer :where(a){color:inherit;text-decoration:none}
.pstv.pstv :where(img),.pstv-layer.pstv-layer :where(img){display:block;max-width:100%;border:0}
.pstv svg,.pstv-layer svg{display:block;flex-shrink:0}
.pstv :where(button,a,input):focus-visible,.pstv-layer :where(button,a):focus-visible{outline:2px solid var(--tv-gold2);outline-offset:3px}
.pstv [hidden],.pstv-layer[hidden]{display:none!important}
.pstv .pstv-in{max-width:1480px;margin:0 auto}

/* ---------- the television ---------- */
.pstv .pstv-stage{display:grid;gap:14px}
.pstv[data-w="l"] .pstv-stage{grid-template-columns:minmax(0,max(520px,calc((100vh - 364px)*16/9))) 344px;justify-content:center;align-items:stretch;gap:22px}
.pstv .pstv-main{min-width:0}
.pstv .pstv-tv{position:relative;border-radius:18px;padding:10px 10px 0;color:#fff;background:linear-gradient(180deg,#26262a,var(--tv-black));
  box-shadow:0 34px 60px -34px rgba(0,0,0,.75),inset 0 0 0 1px #3b3b40,inset 0 1px 0 #5a5a61}
.pstv .pstv-screen{position:relative;aspect-ratio:16/9;border-radius:8px;background:#000;box-shadow:0 0 0 1px #000}
.pstv .pstv-frame{position:absolute;top:0;left:0;right:0;bottom:0;border-radius:inherit;overflow:hidden;background:#000}
.pstv .pstv-frame iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;display:block}
.pstv .pstv-poster{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:inherit;overflow:hidden;display:block;background:#000;color:#fff;transition:opacity .5s var(--tv-ease),visibility .5s}
.pstv .pstv-poster img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.pstv .pstv-poster-play{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,224,130,.97);color:var(--tv-sun-ink);box-shadow:0 0 0 3px rgba(12,12,14,.38),0 10px 26px -8px rgba(0,0,0,.8);transition:transform .25s var(--tv-ease)}
.pstv .pstv-poster-play svg{margin-left:2px}
.pstv .pstv-poster:hover .pstv-poster-play{transform:scale(1.07)}
.pstv .pstv-poster-label{position:absolute;left:50%;top:calc(50% + 38px);transform:translateX(-50%);padding:7px 14px;border-radius:999px;background:rgba(12,12,14,.82);color:#fff;font:600 13px/1.2 var(--tv-sans);white-space:nowrap}
.pstv .pstv-poster-label:empty{display:none}
.pstv .pstv-poster-k{position:absolute;left:12px;bottom:12px;padding:7px 13px;border-radius:999px;background:rgba(12,12,14,.8);color:#fff;font:600 12px/1.3 var(--tv-sans)}
.pstv .pstv-poster-k:empty{display:none}
.pstv .pstv-screen.is-on .pstv-poster{opacity:0;visibility:hidden;pointer-events:none}
.pstv .pstv-screen.is-docked .pstv-poster{opacity:1;visibility:visible;pointer-events:none}
.pstv .pstv-screen.is-docked .pstv-poster-play{display:none}
.pstv .pstv-unmute{position:absolute;z-index:3;top:12px;left:50%;transform:translateX(-50%);display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px 0 12px;border-radius:999px;
  background:rgba(12,12,14,.86);color:#fff;font:600 14px/1 var(--tv-sans);white-space:nowrap;box-shadow:inset 0 0 0 1px rgba(255,213,74,.6)}
.pstv .pstv-static{position:absolute;top:0;left:0;width:100%;height:100%;z-index:2;border-radius:inherit;pointer-events:none;opacity:0;
  background:repeating-radial-gradient(#000 0 .0001%,#fff 0 .0002%) 50% 0/2500px 2500px,repeating-conic-gradient(#000 0 .0001%,#fff 0 .0002%) 60% 60%/2500px 2500px;background-blend-mode:difference}
.pstv .pstv-static.is-on{opacity:.88;animation:pstv-noise .12s steps(3) infinite}
@keyframes pstv-noise{to{background-position:50% 12px,60% 48%}}
.pstv .pstv-banner{position:absolute;z-index:3;right:14px;top:12px;text-align:right;pointer-events:none;opacity:0;transition:opacity .25s}
.pstv .pstv-banner.is-show{opacity:1}
.pstv .pstv-banner b{display:block;font:700 46px/1 var(--tv-mono);color:var(--tv-led);text-shadow:0 2px 0 #000,0 0 16px rgba(0,0,0,.95)}
.pstv .pstv-banner span{display:block;margin-top:4px;font:600 15px/1.3 var(--tv-sans);color:#fff;text-shadow:0 1px 0 #000,0 0 10px #000}
.pstv .pstv-frame.is-docked{position:fixed;top:auto;left:auto;right:12px;bottom:12px;width:min(340px,58vw);aspect-ratio:16/9;z-index:99990;border-radius:12px;
  box-shadow:0 18px 44px -14px rgba(0,0,0,.7),0 0 0 1px rgba(255,213,74,.5)}
.pstv .pstv-dockx{position:absolute;z-index:4;top:6px;right:6px;width:32px;height:32px;border-radius:50%;background:rgba(12,12,14,.86);color:#fff;display:none;place-items:center}
.pstv .pstv-frame.is-docked .pstv-dockx{display:grid}

/* channel banner under the picture */
.pstv .pstv-osd{display:grid;gap:10px;padding:13px 6px 2px;touch-action:pan-y}
.pstv .pstv-osd-ch{display:flex;align-items:center;gap:10px;min-width:0}
.pstv .pstv-osd-num{font:700 31px/1 var(--tv-mono);color:var(--tv-led);text-shadow:0 0 14px rgba(255,213,74,.45);font-variant-numeric:tabular-nums}
.pstv .pstv-logo{position:relative;flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;overflow:hidden;background:var(--tv-sun)}
.pstv .pstv-logo i{font:600 15px/1 var(--tv-sans);font-style:normal;color:var(--tv-sun-ink)}
.pstv .pstv-logo img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.pstv .pstv-osd-name{display:flex;flex-direction:column;gap:5px;min-width:0;margin-right:auto}
.pstv .pstv-osd-name strong{font:600 17px/1.1 var(--tv-sans);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pstv .pstv-badge{display:inline-flex;align-items:center;gap:6px;font:600 10px/1 var(--tv-sans);letter-spacing:.14em;text-transform:uppercase;color:var(--tv-led);white-space:nowrap}
.pstv .pstv-badge::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--tv-red);animation:pstv-pulse 1.8s infinite}
.pstv .pstv-badge[data-mode="vod"]::before,.pstv .pstv-badge[data-mode="list"]::before{background:var(--tv-led);animation:none}
@keyframes pstv-pulse{0%,100%{opacity:1}50%{opacity:.35}}
.pstv .pstv-clock{flex:none;font:600 15px/1 var(--tv-mono);color:#fff;white-space:nowrap}
.pstv .pstv-osd-row{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;align-items:start;width:100%;text-align:left;color:#fff}
.pstv .pstv-osd-row>i{margin-top:3px;padding:5px 0;border-radius:4px;background:var(--tv-led);color:#14110a;font:600 10px/1 var(--tv-sans);font-style:normal;letter-spacing:.12em;text-transform:uppercase;text-align:center}
.pstv .pstv-title{padding-top:.1em;color:#fff;font:500 16px/1.45 var(--tv-sans);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pstv[data-w="l"] .pstv-title{font-size:19px}
.pstv .pstv-sub{margin-top:2px;color:#b9b9c0;font:400 13px/1.45 var(--tv-sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pstv .pstv-bar{display:block;height:4px;margin-top:8px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden}
.pstv .pstv-bar i{display:block;height:100%;width:0;border-radius:4px;background:var(--tv-led)}
.pstv .pstv-osd-row.is-next{align-items:center;padding:9px 0 2px;border-top:1px solid rgba(255,255,255,.12)}
.pstv .pstv-osd-row.is-next>i{margin-top:0;background:rgba(255,255,255,.16);color:#fff}
.pstv .pstv-osd-row.is-next>span{min-width:0;font:400 14px/1.4 var(--tv-sans);color:#d8d8de;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pstv .pstv-osd-row.is-next b{color:#fff;font-weight:600}
/* the logo, on a white plate on the set's lower edge; the same two drawings make the mark at the foot of the page */
.pstv .pstv-defs{position:absolute;width:0;height:0;overflow:hidden}
.pstv .pstv-chin{position:relative;display:flex;align-items:center;justify-content:center;height:48px}
.pstv .pstv-plate{display:flex;align-items:center;gap:8px;height:34px;padding:0 14px 0 9px;border-radius:9px;background:#fff;box-shadow:0 1px 0 rgba(255,255,255,.14),0 0 0 1px rgba(0,0,0,.5)}
.pstv .pstv-plate .pstv-lg-e{width:28px;height:28px}
.pstv .pstv-plate .pstv-lg-w{width:136px;height:12.6px}
.pstv .pstv-chin i{position:absolute;right:12px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:#6b2620}
.pstv:not([data-w="s"]) .pstv-chin{height:54px}
.pstv:not([data-w="s"]) .pstv-plate{height:40px;gap:9px;padding:0 16px 0 10px;border-radius:10px}
.pstv:not([data-w="s"]) .pstv-plate .pstv-lg-e{width:33px;height:33px}
.pstv:not([data-w="s"]) .pstv-plate .pstv-lg-w{width:164px;height:15.2px}
.pstv .pstv-tv.is-on .pstv-chin i{background:#3ddc84;box-shadow:0 0 8px #3ddc84}
.pstv[data-w="l"] .pstv-tv{margin-bottom:20px}
.pstv[data-w="l"] .pstv-tv::after{content:'';position:absolute;left:50%;bottom:-15px;width:220px;height:15px;transform:translateX(-50%);background:linear-gradient(180deg,#2a2a2e,#101013);clip-path:polygon(16% 0,84% 0,100% 100%,0 100%)}

/* ---------- the remote ---------- */
.pstv .pstv-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px}
.pstv .pstv-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 17px;border-radius:999px;font:600 14px/1 var(--tv-sans);white-space:nowrap;
  color:var(--tv-ink2);background:#fff;box-shadow:inset 0 0 0 1px var(--tv-line2);transition:background .2s}
.pstv .pstv-btn:hover{background:#fff3cf}
.pstv .pstv-btn.is-icon{width:44px;padding:0}
.pstv .pstv-btn[aria-pressed="true"],.pstv .pstv-btn.is-back{background:var(--tv-sun);color:var(--tv-sun-ink);box-shadow:0 6px 16px -8px rgba(199,154,42,.9)}
.pstv .pstv-rocker{display:inline-flex;align-items:center;padding:3px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px var(--tv-line2)}
.pstv .pstv-rocker .pstv-btn{width:38px;height:38px;background:none;box-shadow:none}
.pstv .pstv-rocker .pstv-btn:hover{background:#fff3cf}
.pstv .pstv-rocker em{padding:0 4px;font:600 11px/1 var(--tv-sans);font-style:normal;letter-spacing:.12em;color:var(--tv-gold)}
.pstv .pstv-btn.is-live .pstv-dot{width:8px;height:8px;border-radius:50%;background:var(--tv-red)}
.pstv .pstv-btn.is-live.is-now .pstv-dot{animation:pstv-pulse 1.2s infinite}
.pstv #pstv-b-mute[data-on="1"] .pstv-i-off,.pstv #pstv-b-mute[data-on="0"] .pstv-i-on{display:none}

/* ---------- channel list + programme guide ---------- */
.pstv .pstv-side{min-width:0}
.pstv .pstv-side-in{display:flex;flex-direction:column;min-height:0}
.pstv .pstv-side-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 10px}
.pstv .pstv-side-h h3{font:600 12px/1.2 var(--tv-sans);letter-spacing:.14em;text-transform:uppercase;color:var(--tv-gold)}
.pstv .pstv-gx{display:grid;place-items:center;width:32px;height:32px;margin:-6px -6px -6px 0;border-radius:50%;background:var(--tv-wash);color:var(--tv-gold)}
.pstv .pstv-chpane,.pstv .pstv-gpane{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
.pstv .pstv-side[data-view="ch"] .pstv-gpane{display:none}
.pstv .pstv-chlist{display:flex;gap:10px;padding:2px 0 8px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;user-select:none;-webkit-user-select:none}
.pstv .pstv-chlist::-webkit-scrollbar{display:none}
.pstv .pstv-chlist.is-free,.pstv .pstv-rail.is-free{scroll-snap-type:none}
.pstv .pstv-chlist.is-drag,.pstv .pstv-rail.is-drag{cursor:grabbing}
.pstv .pstv-chan{flex:none;display:grid;grid-template-columns:26px 38px minmax(0,1fr);align-items:center;gap:10px;width:216px;padding:10px;border-radius:12px;text-align:left;color:var(--tv-ink);
  background:#fff;box-shadow:inset 0 0 0 1px var(--tv-line);scroll-snap-align:start;transition:background .2s}
.pstv .pstv-chan:hover{background:#fff6dc}
.pstv .pstv-chan[aria-current="true"]{background:#16130c;color:#fff;box-shadow:none}
.pstv .pstv-chan-n{font:700 15px/1 var(--tv-mono);color:var(--tv-gold);font-variant-numeric:tabular-nums}
.pstv .pstv-chan[aria-current="true"] .pstv-chan-n{color:var(--tv-led)}
.pstv .pstv-chan .pstv-logo{width:38px;height:38px}
.pstv .pstv-chan-t{display:block;min-width:0}
.pstv .pstv-chan-t strong{display:block;font:600 14px/1.3 var(--tv-sans);color:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pstv .pstv-chan-now{display:block;font:400 12px/1.45 var(--tv-sans);color:var(--tv-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pstv .pstv-chan[aria-current="true"] .pstv-chan-now{color:#c9c9cf}
.pstv .pstv-chan .pstv-bar{height:3px;margin-top:5px;background:#f1e2b4}
.pstv .pstv-chan .pstv-bar i{background:var(--tv-gold2)}
.pstv .pstv-chan[aria-current="true"] .pstv-bar{background:rgba(255,255,255,.2)}
.pstv .pstv-chan[aria-current="true"] .pstv-bar i{background:var(--tv-led)}
.pstv .pstv-gpane{margin-top:8px;background:#fff;border-radius:16px;box-shadow:inset 0 0 0 1px var(--tv-line);overflow:hidden}
.pstv .pstv-glist{padding:0 6px 6px}
.pstv .pstv-gi{display:grid;grid-template-columns:66px minmax(0,1fr);gap:10px;align-items:start;width:100%;padding:10px;border-radius:10px;text-align:left;transition:background .2s}
.pstv .pstv-gi:hover{background:#fff6dc}
.pstv .pstv-gi.is-now{background:#ffefc0;cursor:default}
.pstv .pstv-gtime{font:600 12.5px/1.5 var(--tv-sans);color:var(--tv-gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.pstv .pstv-gtime small{display:block;font:600 10px/1.4 var(--tv-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--tv-red)}
.pstv .pstv-gt{padding-top:.1em;font:400 14px/1.45 var(--tv-sans);color:var(--tv-ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pstv .pstv-gd{display:block;margin-top:2px;font:400 12px/1.4 var(--tv-sans);color:var(--tv-muted)}
.pstv .pstv-livecard{display:flex;align-items:center;gap:12px;margin-top:10px;padding:12px 14px;border-radius:14px;background:#fff6dc;box-shadow:inset 0 0 0 1px var(--tv-line2)}
.pstv .pstv-livecard-t{flex:1 1 auto;min-width:0}
.pstv .pstv-livecard-t b{display:flex;align-items:center;gap:8px;font:600 14px/1.4 var(--tv-sans);color:var(--tv-ink)}
.pstv .pstv-livecard-t b::before{content:'';flex:none;width:8px;height:8px;border-radius:50%;background:var(--tv-red)}
.pstv .pstv-livecard.is-now b::before{animation:pstv-pulse 1.2s infinite}
.pstv .pstv-livecard-t span{display:block;margin-top:2px;font:400 12.5px/1.45 var(--tv-sans);color:var(--tv-muted)}
.pstv .pstv-livecard .pstv-btn{flex:none;height:40px;padding:0 15px;font-size:13px}
.pstv .pstv-livecard.is-now .pstv-btn{background:var(--tv-red);color:#fff;box-shadow:none}

/* wide: the channel list is a panel beside the television. Nothing in it scrolls on its own, so the wheel always moves the page. */
.pstv[data-w="l"] .pstv-side{background:#fff;border-radius:16px;box-shadow:inset 0 0 0 1px var(--tv-line),0 20px 40px -32px rgba(138,109,31,.55);overflow:hidden}
.pstv[data-w="l"] .pstv-side-in{height:100%}
.pstv[data-w="l"] .pstv-side[data-view="guide"] .pstv-chpane{display:none}
.pstv[data-w="l"] .pstv-chpane,.pstv[data-w="l"] .pstv-gpane{flex:0 0 auto}
.pstv[data-w="l"] .pstv-chlist{flex-direction:column;gap:2px;padding:0 6px 6px;overflow:visible;scroll-snap-type:none}
.pstv[data-w="l"] .pstv-chan{width:100%;background:none;box-shadow:none;padding:8px 10px}
.pstv[data-w="l"] .pstv-chan:hover{background:#fff6dc}
.pstv[data-w="l"] .pstv-chan[aria-current="true"]{background:#16130c}
.pstv[data-w="l"] .pstv-gpane{margin-top:0;background:none;border-radius:0;box-shadow:none;overflow:visible}
.pstv[data-w="l"] .pstv-livecard{flex:none;margin-top:auto;border-radius:0;box-shadow:none;border-top:1px solid var(--tv-line2)}

      var t0 = null;
      sh.addEventListener('touchstart', function (e) { t0 = e.touches.length === 1 ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : null; }, { passive: true });
      sh.addEventListener('touchend', function (e) {
        if (!t0) return;
        var t = e.changedTouches[0], dx = t.clientX - t0.x, dy = t.clientY - t0.y; t0 = null;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 56) return;
        var fwd = Math.abs(dx) > Math.abs(dy) ? dx < 0 : dy < 0;
        shortsShow(sh.i + (fwd ? 1 : -1));
      }, { passive: true });
    }
    sh.ids = ids; sh.back = document.activeElement; sh.resume = false;
    try { if (Pready && S.mode !== 'live') { var st = P.getPlayerState(); sh.resume = st === 1 || st === 3; P.pauseVideo(); } } catch (e) { }
    sh.hidden = false;
    shortsShow(i);
    try { sh.querySelector('.pstv-sh-x').focus(); } catch (e) { }
  }
  function shortsShow(i) {
    if (!sh || i < 0 || i >= sh.ids.length) return;
    sh.i = i;
    var id = sh.ids[i], nav = sh.querySelectorAll('.pstv-sh-nav');
    sh.querySelector('iframe').src = 'https://www.youtube.com/embed/' + id + '?autoplay=1&playsinline=1&rel=0&loop=1&playlist=' + id;
    sh.querySelector('.pstv-sh-t').textContent = title(id);
    nav[0].disabled = i === 0; nav[1].disabled = i === sh.ids.length - 1;
  }
  function shortsClose() {
    if (!sh || sh.hidden) return;
    sh.hidden = true; sh.querySelector('iframe').src = 'about:blank';
    if (sh.resume) { if (S.mode === 'tv') tuneTV(); else { try { P.playVideo(); } catch (e) { } } }
    try { if (sh.back && sh.back.focus) sh.back.focus(); } catch (e) { }
  }
  document.addEventListener('keydown', function (e) {
    if (!sh || sh.hidden) return;
    if (e.key === 'Escape' || e.key === 'Esc') shortsClose();
    else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); shortsShow(sh.i + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); shortsShow(sh.i - 1); }
  });

  /* ---------- mini player when the screen scrolls away ---------- */
  function dock(on) {
    if (on === el.frame.classList.contains('is-docked')) return;
    el.frame.classList.toggle('is-docked', on);
    el.screen.classList.toggle('is-docked', on);
    el.posterK.textContent = on ? 'Playing in the mini player' : '';
    if (on) requestAnimationFrame(function () {    // a transformed ancestor would trap position:fixed; if so, give the idea up
      var r = el.frame.getBoundingClientRect();
      if (r.width < 40 || r.height < 30 || r.left < -2 || r.top < -2 || r.right > window.innerWidth + 2 || r.bottom > window.innerHeight + 2) { S.dockBroken = true; dock(false); }
    });
  }
  if (window.IntersectionObserver) new IntersectionObserver(function (es) {
    var vis = es[es.length - 1].isIntersecting, playing = false;
    try { playing = S.mode === 'live' || plainOn() || (Pready && (P.getPlayerState() === 1 || P.getPlayerState() === 3)); } catch (e) { }
    // only follow the viewer once they are really watching (sound on, or the live stream)
    dock(!vis && playing && S.started && (S.mode === 'live' || !S.muted) && !S.dockOff && !S.dockBroken);
  }, { threshold: 0.12 }).observe(el.screen);

  /* ---------- taps and clicks ---------- */
  var justDragged = false;
  root.addEventListener('click', function (e) {
    if (justDragged) { justDragged = false; e.preventDefault(); e.stopPropagation(); return; }
    var x = closest(e.target, 'button,a');
    if (!x || !root.contains(x)) return;
    var a;
    if (x === el.poster) return powerOn();
    if (x === el.unmute) { S.hush = false; engage(); return; }
    if (x === el.bMute) { if (S.muted) { if (!S.started) powerOn(); else { S.hush = false; engage(); } } else { S.hush = true; mute(); } return; }
    if (x.id === 'pstv-ch-up') return stepChannel(1);
    if (x.id === 'pstv-ch-dn') return stepChannel(-1);
    if (x === el.bGuide) { view(el.side.getAttribute('data-view') === 'guide' ? 'ch' : 'guide'); return; }
    if (x.id === 'pstv-gx') return view('ch');
    if (x === el.bTv) return goTV(true);
    if (x === el.bLive) { var li = liveInfo(), l0 = latestLive(); if ((li && li.on) || !l0) goLive(); else goVod(l0.id, l0.ids, 'Latest live satsang'); return; }
    if (x.getAttribute('data-act') === 'live') { goLive(); toStage(); return; }
    if (x.getAttribute('data-act') === 'lastlive') { var ll = latestLive(); if (ll) { goVod(ll.id, ll.ids, 'Latest live satsang'); toStage(); } return; }
    if (x === el.bPrev) { engage(); step(-1); return; }
    if (x === el.bNext) { engage(); step(1); return; }
    if (x.id === 'pstv-dockx') {
      S.dockOff = true; dock(false);
      if (S.mode === 'live') goTV();
      else { try { P.pauseVideo(); } catch (er) { } var pf = $('pstv-plain'); if (pf) pf.src = 'about:blank'; }
      return;
    }
    if ((a = x.getAttribute('data-ch'))) return setChannel(a, true);
    if ((a = x.getAttribute('data-g'))) {
      if (S.mode === 'list') { engage(); try { P.playVideoAt(Math.max(0, (P.getPlaylist() || []).indexOf(a))); } catch (er) { } }
      else if (S.mode === 'vod') goVod(a, S.queue, S.qlabel);
      else goVod(a, upcoming(S.ch, Date.now(), Math.min(wheel(S.ch).it.length, 14)).map(function (s) { return s.id; }), S.ch.n + ' · from the guide');
      return;
    }
    if ((a = x.getAttribute('data-scroll'))) {
      var rail = closest(x, '.pstv-sec').querySelector('.pstv-rail');
      if (rail) { try { rail.scrollBy({ left: Number(a) * rail.clientWidth * 0.82, behavior: 'smooth' }); } catch (er) { rail.scrollLeft += Number(a) * rail.clientWidth * 0.82; } }
      return;
    }
    if ((a = x.getAttribute('data-more'))) return showMore(a, x);
    if ((a = x.getAttribute('data-col'))) return openCol(x.getAttribute('data-group'), a, x);
    if (x.getAttribute('data-colclose')) return closeCol();
    if ((a = x.getAttribute('data-colmore'))) {
      var p = S.open && S.open.p, body = closest(x, '[data-colbody]');
      if (p && body) { body.innerHTML = panelGrid(p, Number(a)); watchTitles(body); markCurrent(); }
      return;
    }
    if ((a = x.getAttribute('data-playall'))) { var pc = S.open && S.open.p; goList(a, pc ? pc.t : '', pc && pc.all); toStage(); return; }
    if (x.getAttribute('data-clearq')) { el.q.value = ''; search(); return; }
    if ((a = x.getAttribute('data-v'))) {
      var box = closest(x, '.pstv-rail,.pstv-grid'), ids = [], label = '';
      if (box) { var cs = box.querySelectorAll('.pstv-card[data-v]'); for (var i = 0; i < cs.length; i++) ids.push(cs[i].getAttribute('data-v')); }
      if (x.getAttribute('data-short')) return shorts(ids.length ? ids : [a], Math.max(0, ids.indexOf(a)));
      var sec = closest(x, '.pstv-sec'), h2 = sec ? sec.querySelector('.pstv-h2') : null;
      if (box && box.getAttribute('data-colgrid') && S.open) { label = S.open.p.t; ids = S.open.p.all || ids; }
      else label = h2 ? h2.textContent : 'Search';
      goVod(a, ids, label); toStage();
    }
  });
  var qTimer;
  el.q.addEventListener('input', function () { clearTimeout(qTimer); qTimer = setTimeout(search, 180); });
  el.q.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); clearTimeout(qTimer); search(); el.q.blur(); } });

  // swipe sideways on the channel banner to change channel
  var sw = null;
  el.osd.addEventListener('touchstart', function (e) { sw = e.touches.length === 1 ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : null; }, { passive: true });
  el.osd.addEventListener('touchend', function (e) {
    if (!sw) return;
    var t = e.changedTouches[0], dx = t.clientX - sw.x, dy = t.clientY - sw.y; sw = null;
    if (Math.abs(dx) > 56 && Math.abs(dx) > 2 * Math.abs(dy)) stepChannel(dx < 0 ? 1 : -1);
  }, { passive: true });

  // with a mouse, rows and the channel strip can be dragged sideways
  var drag = null;
  root.addEventListener('pointerdown', function (e) {
    if (e.pointerType !== 'mouse' || e.button !== 0) return;
    var sc = closest(e.target, '.pstv-rail,.pstv-chlist');
    if (!sc || sc.scrollWidth <= sc.clientWidth + 2) return;
    drag = { el: sc, x: e.clientX, left: sc.scrollLeft, moved: false };
  });
  window.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var dx = e.clientX - drag.x;
    if (!drag.moved && Math.abs(dx) < 6) return;
    drag.moved = true;
    drag.el.classList.add('is-drag');
    drag.el.classList.add('is-free');        // once dragged with a mouse, the row stops snapping, so it stays where it is let go
    drag.el.scrollLeft = drag.left - dx;
  });
  function endDrag() {
    if (!drag) return;
    drag.el.classList.remove('is-drag');
    if (drag.moved) { justDragged = true; setTimeout(function () { justDragged = false; }, 60); }
    drag = null;
  }
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);
  root.addEventListener('dragstart', function (e) { if (closest(e.target, '.pstv-rail,.pstv-chlist')) e.preventDefault(); });
  root.addEventListener('scroll', function (e) {
    var t = e.target;
    if (!t || !t.classList || !t.classList.contains('pstv-rail') || t.__q) return;
    t.__q = 1;
    requestAnimationFrame(function () { t.__q = 0; arrows(t); });
  }, true);

  /* ---------- start ---------- */
  renderChannels(true);
  renderBody();
  measure();
  if (window.ResizeObserver) new ResizeObserver(measure).observe(root);
  window.addEventListener('resize', measure);
  showChannel();
  if (okId(params.v)) { goVod(params.v, [params.v], '', true); needTitle(params.v); }
  else tuneTV();
  el.clock.textContent = fmtClock(Date.now());
  setInterval(function () { el.clock.textContent = fmtClock(Date.now()); }, 5000);
  setInterval(function () {
    if (S.mode === 'tv' && S.slot && !S.started) {      // TV still off: keep the poster on whatever is on air
      var s = slotAt(S.ch, Date.now());
      if (s && s.id !== S.cur && !S.bad[s.id]) { S.slot = s; S.cur = s.id; if (!Pready) pending = { id: s.id, start: s.off }; }
    }
    renderNow(); renderGuide(); renderChannels();
  }, 20000);
  setTimeout(syncChannel, 2500);
})();

</script>
